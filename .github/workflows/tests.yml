name: Cross-platform tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[desktop,mcp]" pytest
      - name: Unit tests
        run: python -m pytest -q
      - name: CLI smoke
        run: python -m markveil --help
  package:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: markveil-linux
          - os: windows-latest
            artifact: markveil-windows
          - os: macos-latest
            artifact: markveil-macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e ".[desktop]" pyinstaller
      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Markveil --icon src/markveil/assets/markveil.ico --add-data "src/markveil/assets;markveil/assets" --collect-all tkinterdnd2 --paths src launcher.py
      - name: Build Linux and macOS
        if: runner.os != 'Windows'
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name Markveil --add-data "src/markveil/assets:markveil/assets" --collect-all tkinterdnd2 --paths src launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/
