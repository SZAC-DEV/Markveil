[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photoguard-open"
version = "0.7.0"
description = "Open-source photographic preview protection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "PhotoGuard Contributors"}]
dependencies = ["Pillow>=10.0,<13"]

[project.scripts]
photoguard = "photoguard.cli:main"
photoguard-gui = "photoguard.gui:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
attack = ["opencv-python-headless>=4.8,<5", "numpy>=1.24,<3"]
adversarial = ["torch>=2.1", "diffusers>=0.30", "transformers>=4.38,<5", "safetensors>=0.4", "accelerate>=0.25", "numpy>=1.24,<3"]
