[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "markveil"
version = "0.10.0"
description = "Open-source photographic preview protection toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Markveil Contributors"}]
dependencies = ["Pillow>=10.0,<13"]

[project.scripts]
markveil = "markveil.cli:main"
markveil-gui = "markveil.gui:main"
markveil-mcp = "markveil.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
mcp = ["mcp>=1.12,<2"]
attack = ["opencv-python-headless>=4.8,<5", "numpy>=1.24,<3"]
adversarial = ["torch>=2.1", "diffusers>=0.30", "transformers>=4.38,<5", "safetensors>=0.4", "accelerate>=0.25", "numpy>=1.24,<3"]
